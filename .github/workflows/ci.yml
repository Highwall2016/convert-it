name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, security/harden-file-converters, feat/cloudflare-owned-ffmpeg]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      # The smoke suite drives the runner's preinstalled Google Chrome, so
      # Playwright's own browser download is skipped.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm run typecheck

      - run: npm run lint

      - run: npx prettier --check .

      # The codec, PDFium, resvg and OCR files under public/ are committed
      # copies of node_modules files: fail if an upgrade left them stale.
      - run: npm run copy-wasm -- --check

      # W3C epubcheck (Java, preinstalled on the runner) validates every EPUB
      # the converters produce; the test runs only when EPUBCHECK_JAR is set.
      # Pinned by hash like any other executable we download.
      - name: Fetch epubcheck
        run: |
          curl -sSL -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          echo "0532f6291faa2bb729dd253f958868a2a57dbd2c32f881a97c7c980c5940309e  /tmp/epubcheck.zip" | sha256sum -c -
          unzip -q /tmp/epubcheck.zip -d /tmp

      - run: npm run test
        env:
          EPUBCHECK_JAR: /tmp/epubcheck-5.2.1/epubcheck.jar

      # Runtime dependencies only: every one of them parses untrusted files in
      # the user's browser. Dev tooling advisories are handled by Dependabot.
      - run: npm audit --omit=dev --audit-level=high

      # Do not trust a CDN response without the repo-pinned SHA-256.
      # This also catches incorrect CORS and content-type before any build.
      - name: Verify owner-controlled FFmpeg R2 CDN
        run: node scripts/check-ffmpeg-st.mjs https://convert-assets.highwall-lab.us.ci/ffmpeg-core/0.12.10

      # The multi-threaded core (2–3x faster video on 4+ cores) is turned on
      # only once it's on the CDN, with CORS for the site and the pinned hashes
      # (the "Upload multi-threaded FFmpeg core" workflow puts it there). Then
      # the smoke suite must run on it: SMOKE_EXPECT_MT fails on any fallback.
      # Set after the unit tests, which must not see it.
      - name: Use the multi-threaded FFmpeg core if it's on the CDN
        run: |
          MT=https://convert-assets.highwall-lab.us.ci/ffmpeg-core-mt/0.12.10
          if node scripts/check-ffmpeg-mt.mjs "$MT"; then
            echo "NEXT_PUBLIC_FFMPEG_MT_BASE_URL=$MT" >> "$GITHUB_ENV"
            echo "SMOKE_EXPECT_MT=1" >> "$GITHUB_ENV"
          else
            echo "::notice::Multi-threaded FFmpeg core not on the CDN; building single-threaded only"
          fi

      # postbuild adds the CSP (out/_headers + per-page hashes).
      # Public CDN URL, inlined into the bundle at build time — not a secret.
      # Must match the value in the Pages project's env vars; the generated CSP
      # allows its origin in connect-src. Scoped to this step on purpose: the
      # unit tests must run without it (they would otherwise hit the real CDN).
      - run: npm run build
        env:
          NEXT_PUBLIC_FFMPEG_BASE_URL: https://convert-assets.highwall-lab.us.ci/ffmpeg-core/0.12.10

      # Real codecs in a real browser against the built site with its _headers
      # applied. Checks the downloaded bytes, and fails on any CSP violation.
      # Port 3000 is in the R2 bucket's CORS allowlist, so FFmpeg loads from the
      # production CDN and its pinned hash is checked on every run.
      - name: Browser smoke suite
        run: |
          npm run fixtures
          node scripts/serve-out.mjs 3000 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/smoke.mjs
          # Fail if a real browser observes unexpected outbound network requests.
          node scripts/security-egress-smoke.mjs
          # axe-core (WCAG 2.1 AA) on every page and interactive state, both
          # themes; serious or critical violations fail the build.
          node scripts/a11y-smoke.mjs
          # Service worker offline behaviour; runs its own server on port 3100,
          # which it stops to go offline for real.
          node scripts/offline-smoke.mjs

      # Cloudflare Pages Git integration builds the reviewed staging branch.
      # Do not deploy this same build through a second credential-bearing CI path.

  # Browser differences are a security issue for a local-only file converter:
  # native codec selection, WebAssembly workers, CSP and memory handling vary.
  # Keep independent Linux WebKit/Firefox checks for each PR, not just local Mac.
  cross-browser-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Firefox and WebKit with Linux dependencies
        run: npx playwright install --with-deps firefox webkit
      - name: Build the exact PR commit
        run: |
          npm run fixtures
          npm run build
      - name: Cross-browser conversion and malicious-file checks
        run: |
          node scripts/serve-out.mjs 3000 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/cross-browser-security-smoke.mjs firefox
          node scripts/cross-browser-security-smoke.mjs webkit
          node scripts/browser-adversarial-smoke.mjs firefox
          node scripts/browser-adversarial-smoke.mjs webkit
